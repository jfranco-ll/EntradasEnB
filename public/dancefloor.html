<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 FIESTA DEL 24 - Pista de Baile 🪩</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos para los personajes Mii en 2D */
    .mii-character {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease-out;
      cursor: pointer;
      z-index: 20;
      transform: translate(-50%, -50%);
    }
    .mii-nametag {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(236, 72, 153, 0.6);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      white-space: nowrap;
      margin-bottom: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .mii-avatar-container {
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      background: #1e293b;
      border: 2px solid #ec4899;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
    }
    .mii-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Animación de baile suave 2D */
    @keyframes miiDance2D {
      0%, 100% { transform: translate(-50%, -50%) translateY(0) scale(1); }
      50% { transform: translate(-50%, -50%) translateY(-6px) scale(1.05); }
    }
    .mii-dancing {
      animation: miiDance2D 1.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 relative select-none">

  <!-- CABECERA -->
  <header class="w-full max-w-xl text-center pt-2 pb-4 z-30">
    <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-300 to-cyan-400 tracking-wider uppercase mb-2">
      🎄 FIESTA DEL 24 🎄
    </h1>
    <div class="inline-flex items-center space-x-2 bg-slate-900/90 border border-pink-500/30 px-4 py-1.5 rounded-full shadow-lg">
      <span class="w-2.5 h-2.5 bg-green-400 rounded-full animate-ping"></span>
      <p class="text-pink-200 text-xs sm:text-sm font-semibold">
        <span id="active-count" class="text-white font-bold">0</span> Personajes en Pista
      </p>
    </div>
    <p class="text-slate-400 text-xs mt-1">Toca un avatar para ver su Instagram</p>
  </header>

  <!-- PISTA DE BAILE 2D RESPONSIVA (Sin rotaciones raras) -->
  <main class="w-full max-w-2xl flex-1 flex items-center justify-center my-2">
    <div id="dancefloor-container" class="relative w-full h-[420px] sm:h-[500px] bg-slate-900 border-4 border-purple-500/50 rounded-3xl p-4 shadow-[0_0_40px_rgba(168,85,247,0.25)] overflow-hidden">
      
      <!-- Cuadrícula de suelo de discoteca -->
      <div id="grid-bg" class="absolute inset-0 grid grid-cols-6 sm:grid-cols-8 grid-rows-6 gap-2 p-3 opacity-30 pointer-events-none"></div>

      <!-- Capa de avatares -->
      <div id="mii-layer" class="absolute inset-0 pointer-events-auto"></div>
    </div>
  </main>

  <!-- BOTÓN VOLVER -->
  <footer class="w-full max-w-xl text-center py-2 z-30">
    <a href="/" class="inline-block bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 px-5 py-2 rounded-full border border-slate-600 shadow-md transition-colors">
      &larr; Volver al Portal Principal
    </a>
  </footer>

  <!-- MODAL DE DETALLES -->
  <div id="guest-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border-2 border-pink-500/50 rounded-3xl p-6 max-w-xs w-full text-center relative shadow-2xl">
      <button onclick="closeGuestModal()" class="absolute top-3 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
      
      <div class="w-20 h-20 rounded-full border-4 border-pink-500 mx-auto mb-3 overflow-hidden shadow-lg">
        <img id="modal-img" src="" alt="Avatar" class="w-full h-full object-cover">
      </div>
      
      <h3 id="modal-name" class="text-xl font-black text-white mb-1"></h3>
      <p id="modal-ig" class="text-pink-400 font-semibold text-xs mb-5"></p>

      <a id="modal-ig-link" href="#" target="_blank" class="block w-full bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold py-2.5 rounded-xl shadow-md text-xs hover:opacity-90">
        Ver Perfil de Instagram &rarr;
      </a>
    </div>
  </div>

  <script>
    const miiLayer = document.getElementById('mii-layer');
    const gridBg = document.getElementById('grid-bg');
    const activeCountEl = document.getElementById('active-count');
    const charactersMap = new Map();

    // Generar baldosas de suelo
    for (let i = 0; i < 48; i++) {
      const tile = document.createElement('div');
      const colors = ['bg-pink-500/20', 'bg-purple-500/20', 'bg-cyan-500/20', 'bg-indigo-500/20'];
      tile.className = `rounded-lg ${colors[Math.floor(Math.random() * colors.length)]} transition-colors duration-1000`;
      gridBg.appendChild(tile);
    }

    // Luces parpadeantes
    setInterval(() => {
      const tiles = gridBg.children;
      for (let i = 0; i < 6; i++) {
        const randomTile = tiles[Math.floor(Math.random() * tiles.length)];
        const colors = ['bg-pink-500/40', 'bg-purple-500/40', 'bg-cyan-500/40', 'bg-indigo-500/40'];
        randomTile.className = `rounded-lg ${colors[Math.floor(Math.random() * colors.length)]} transition-colors duration-500`;
      }
    }, 800);

    async function fetchDancefloorGuests() {
      try {
        const response = await fetch('/api/guests/dancefloor');
        const data = await response.json();

        if (data.success) {
          activeCountEl.innerText = data.guests.length;
          renderGuests(data.guests);
        }
      } catch (err) {
        console.error('Error al cargar la pista:', err);
      }
    }

    function renderGuests(guests) {
      guests.forEach(guest => {
        if (!charactersMap.has(guest.id)) {
          createMiiCharacter(guest);
        }
      });
    }

    function createMiiCharacter(guest) {
      const char = document.createElement('div');
      char.className = 'mii-character mii-dancing';
      char.id = `mii-${guest.id}`;

      // Posicionamiento seguro dentro del recuadro
      const randomX = Math.random() * 80 + 10;
      const randomY = Math.random() * 75 + 12;

      char.style.left = `${randomX}%`;
      char.style.top = `${randomY}%`;

      const displayTag = guest.instagram ? `${guest.instagram}` : guest.name;
      const cleanIg = guest.instagram ? guest.instagram.replace('@', '').trim() : guest.name;

      const profilePicUrl = `https://api.dicebear.com/7.x/lorelei/svg?seed=${encodeURIComponent(cleanIg)}&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`;

      char.innerHTML = `
        <div class="mii-nametag">${displayTag}</div>
        <div class="mii-avatar-container">
          <img src="${profilePicUrl}" alt="${guest.name}" class="mii-avatar-img">
        </div>
      `;

      char.addEventListener('click', () => showGuestModal(guest, profilePicUrl));

      miiLayer.appendChild(char);
      charactersMap.set(guest.id, char);
    }

    function showGuestModal(guest, avatarUrl) {
      document.getElementById('modal-img').src = avatarUrl;
      document.getElementById('modal-name').innerText = guest.name;
      const ig = guest.instagram || '@sin_instagram';
      document.getElementById('modal-ig').innerText = ig;
      
      const cleanIg = ig.replace('@', '').trim();
      document.getElementById('modal-ig-link').href = `https://instagram.com/${cleanIg}`;

      const modal = document.getElementById('guest-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeGuestModal() {
      const modal = document.getElementById('guest-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    fetchDancefloorGuests();
    setInterval(fetchDancefloorGuests, 5000);
  </script>
</body>
</html>
