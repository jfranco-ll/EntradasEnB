<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyPass - Control de Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- PANTALLA DE LOGIN (Bloqueo de seguridad) -->
  <div id="login-container" class="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
    <h1 class="text-2xl font-bold text-pink-500 mb-2">🔒 Acceso Restringido</h1>
    <p class="text-slate-400 text-sm mb-6">Introduce la contraseña de puerta para activar el escáner.</p>
    
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <input type="password" id="door-password" placeholder="Contraseña de puerta" required
        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 text-center">
      <button type="submit" class="w-full py-3 bg-pink-600 hover:bg-pink-500 font-semibold rounded-xl text-white transition-all shadow-lg shadow-pink-600/30">
        Entrar al Escáner
      </button>
      <p id="login-error" class="text-red-500 text-sm hidden font-medium"></p>
    </form>
  </div>

  <!-- CONTENEDOR DEL ESCÁNER (Oculto hasta hacer login) -->
  <div id="scanner-container" class="hidden max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-pink-500">🔍 Escáner en Puerta</h1>
      <button onclick="logout()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">Cerrar Sesión</button>
    </div>
    <p class="text-slate-400 text-sm mb-4">Apunta con la cámara al código QR de la entrada</p>

    <!-- Área de la cámara -->
    <div id="reader" class="overflow-hidden rounded-xl border-2 border-slate-700 bg-black mb-4"></div>

    <!-- Resultados del escaneo -->
    <div id="result-box" class="hidden p-4 rounded-xl text-center font-bold text-lg mb-4 transition-all duration-300">
      <p id="result-message"></p>
      <div id="guest-info" class="mt-3 text-sm font-normal text-slate-300 hidden">
        <img id="guest-avatar" src="" class="w-16 h-16 rounded-full mx-auto mb-2 border-2 border-pink-500">
        <p><strong>Nombre:</strong> <span id="guest-name"></span></p>
        <p id="guest-ig-container"><strong>Instagram:</strong> <span id="guest-ig"></span></p>
      </div>
    </div>

    <button id="reset-btn" onclick="startScanner()" class="hidden w-full py-3 bg-pink-600 hover:bg-pink-500 font-semibold rounded-xl text-white transition-all shadow-lg shadow-pink-600/30">
      Escanear Siguiente Entrada
    </button>
  </div>

  <script>
    let html5QrcodeScanner;

    async function handleLogin(event) {
      event.preventDefault();
      const password = document.getElementById('door-password').value;
      const errorText = document.getElementById('login-error');

      errorText.classList.add('hidden');

      try {
        const response = await fetch('/api/scanner-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Ocultar login y mostrar escáner
          document.getElementById('login-container').classList.add('hidden');
          document.getElementById('scanner-container').classList.remove('hidden');
          startScanner();
        } else {
          errorText.innerText = data.message || 'Contraseña incorrecta';
          errorText.classList.remove('hidden');
        }
      } catch (err) {
        errorText.innerText = 'Error de conexión con el servidor';
        errorText.classList.remove('hidden');
      }
    }

    function logout() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error(err));
      }
      document.getElementById('scanner-container').classList.add('hidden');
      document.getElementById('login-container').classList.remove('hidden');
      document.getElementById('door-password').value = '';
    }

    function onScanSuccess(decodedText, decodedResult) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }
      validarEntrada(decodedText);
    }

    async function validarEntrada(guestId) {
      const resultBox = document.getElementById('result-box');
      const resultMessage = document.getElementById('result-message');
      const guestInfo = document.getElementById('guest-info');
      const resetBtn = document.getElementById('reset-btn');

      resultBox.classList.remove('hidden', 'bg-green-600', 'bg-red-600', 'bg-yellow-600');
      resultMessage.innerText = "Verificando en Supabase...";

      try {
        const response = await fetch('/api/guests/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guestId })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          resultBox.classList.add('bg-green-600');
          resultMessage.innerText = data.message;
          
          document.getElementById('guest-name').innerText = data.guest.name;
          document.getElementById('guest-avatar').src = data.guest.avatar_url;
          if(data.guest.instagram) {
            document.getElementById('guest-ig').innerText = data.guest.instagram;
            document.getElementById('guest-ig-container').classList.remove('hidden');
          } else {
            document.getElementById('guest-ig-container').classList.add('hidden');
          }
          guestInfo.classList.remove('hidden');

        } else if (response.status === 400 && data.guest) {
          resultBox.classList.add('bg-yellow-600');
          resultMessage.innerText = data.message;
          document.getElementById('guest-name').innerText = data.guest.name;
          document.getElementById('guest-avatar').src = data.guest.avatar_url;
          guestInfo.classList.remove('hidden');
        } else {
          resultBox.classList.add('bg-red-600');
          resultMessage.innerText = data.message;
          guestInfo.classList.add('hidden');
        }

      } catch (err) {
        resultBox.classList.add('bg-red-600');
        resultMessage.innerText = "❌ Error de conexión al verificar.";
      }

      resetBtn.classList.remove('hidden');
    }

    function startScanner() {
      document.getElementById('result-box').classList.add('hidden');
      document.getElementById('reset-btn').classList.add('hidden');

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } });
      html5QrcodeScanner.render(onScanSuccess);
    }
  </script>
</body>
</html>
