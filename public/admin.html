<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyPass - Registro de Asistentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- PANTALLA DE LOGIN DE ADMINISTRACIÓN -->
  <div id="admin-login-container" class="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
    <h1 class="text-2xl font-bold text-pink-500 mb-2">🔐 Panel Admin</h1>
    <p class="text-slate-400 text-sm mb-6">Introduce la contraseña de administrador para registrar asistentes.</p>
    
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
      <input type="password" id="admin-password" placeholder="Contraseña Admin" required
        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 text-center">
      <button type="submit" class="w-full py-3 bg-pink-600 hover:bg-pink-500 font-semibold rounded-xl text-white transition-all shadow-lg shadow-pink-600/30">
        Acceder al Registro
      </button>
      <p id="admin-login-error" class="text-red-500 text-sm hidden font-medium"></p>
    </form>
  </div>

  <!-- PANEL DE REGISTRO (Oculto hasta hacer login) -->
  <div id="admin-panel-container" class="hidden max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-pink-500">🎟️ Registro de Asistente</h1>
      <button onclick="logoutAdmin()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">Cerrar Sesión</button>
    </div>

    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Nombre Completo</label>
        <input type="text" id="name" required placeholder="Ej. Juan Pérez"
          class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="ejemplo@correo.com"
          class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Usuario de Instagram (Opcional)</label>
        <input type="text" id="instagram" placeholder="@usuario"
          class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
      </div>

      <div class="flex items-center space-x-3 pt-2">
        <input type="checkbox" id="public_consent" class="w-5 h-5 accent-pink-500 rounded border-slate-700 bg-slate-800">
        <label for="public_consent" class="text-xs text-slate-300">Mostrar personaje en la pantalla pública de la fiesta</label>
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 bg-pink-600 hover:bg-pink-500 font-semibold rounded-xl text-white transition-all shadow-lg shadow-pink-600/30 mt-4">
        Registrar y Enviar Entrada
      </button>
    </form>

    <div id="status-box" class="hidden mt-4 p-4 rounded-xl text-center text-sm font-medium"></div>
  </div>

  <script>
    async function handleAdminLogin(event) {
      event.preventDefault();
      const password = document.getElementById('admin-password').value;
      const errorText = document.getElementById('admin-login-error');

      errorText.classList.add('hidden');

      try {
        const response = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          document.getElementById('admin-login-container').classList.add('hidden');
          document.getElementById('admin-panel-container').classList.remove('hidden');
        } else {
          errorText.innerText = data.message || 'Contraseña incorrecta';
          errorText.classList.remove('hidden');
        }
      } catch (err) {
        errorText.innerText = 'Error de conexión con el servidor';
        errorText.classList.remove('hidden');
      }
    }

    function logoutAdmin() {
      document.getElementById('admin-panel-container').classList.add('hidden');
      document.getElementById('admin-login-container').classList.remove('hidden');
      document.getElementById('admin-password').value = '';
    }

    async function handleRegister(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const statusBox = document.getElementById('status-box');

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        instagram: document.getElementById('instagram').value,
        public_consent: document.getElementById('public_consent').checked
      };

      submitBtn.disabled = true;
      submitBtn.innerText = 'Procesando y Enviando Email...';
      statusBox.className = 'mt-4 p-4 rounded-xl text-center text-sm font-medium bg-slate-800 text-slate-300';
      statusBox.innerText = 'Registrando en Supabase y enviando correo...';
      statusBox.classList.remove('hidden');

      try {
        const response = await fetch('/api/guests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          statusBox.className = 'mt-4 p-4 rounded-xl text-center text-sm font-medium bg-green-950 text-green-400 border border-green-800';
          statusBox.innerText = '✅ ¡Asistente registrado y entrada enviada con éxito!';
          document.getElementById('register-form').reset();
        } else {
          statusBox.className = 'mt-4 p-4 rounded-xl text-center text-sm font-medium bg-red-950 text-red-400 border border-red-800';
          statusBox.innerText = '❌ Error: ' + (data.error || 'No se pudo completar el registro');
        }
      } catch (err) {
        statusBox.className = 'mt-4 p-4 rounded-xl text-center text-sm font-medium bg-red-950 text-red-400 border border-red-800';
        statusBox.innerText = '❌ Error de conexión al servidor.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Registrar y Enviar Entrada';
      }
    }
  </script>
</body>
</html>
